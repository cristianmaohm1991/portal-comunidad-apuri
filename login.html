<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Ingresar - Comunidad de Apurí</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Configuración de Supabase -->
    <script src="js/supabase.js"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            font-family: Arial, sans-serif;

            min-height: 100vh;

            background:
                linear-gradient(
                    rgba(20, 60, 40, 0.78),
                    rgba(20, 60, 40, 0.78)
                ),
                url("https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1600&q=80");

            background-size: cover;
            background-position: center;

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .login-container {

            width: 100%;
            max-width: 420px;

            background: white;

            border-radius: 16px;

            padding: 40px 35px;

            box-shadow:
                0 10px 35px
                rgba(0, 0, 0, 0.25);

            text-align: center;
        }

        .logo {

            font-size: 42px;

            margin-bottom: 10px;
        }

        h1 {

            color: #285943;

            font-size: 28px;

            margin-bottom: 8px;
        }

        .subtitle {

            color: #666;

            margin-bottom: 30px;

            line-height: 1.5;
        }

        .form-group {

            text-align: left;

            margin-bottom: 20px;
        }

        label {

            display: block;

            font-weight: bold;

            margin-bottom: 8px;

            color: #26352b;
        }

        input {

            width: 100%;

            padding: 14px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 16px;

            outline: none;
        }

        input:focus {

            border-color: #285943;

            box-shadow:
                0 0 0 2px
                rgba(40, 89, 67, 0.12);
        }

        .login-button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #e5b94b;

            color: #1e3024;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 5px;
        }

        .login-button:hover {

            background: #f0c85b;
        }

        .login-button:disabled {

            opacity: 0.6;

            cursor: not-allowed;
        }

        .message {

            margin-top: 20px;

            padding: 12px;

            border-radius: 8px;

            display: none;

            font-size: 14px;

            line-height: 1.4;
        }

        .message.error {

            display: block;

            background: #fdecec;

            color: #a33a32;
        }

        .message.success {

            display: block;

            background: #eaf6ed;

            color: #287a46;
        }

        .back {

            display: inline-block;

            margin-top: 25px;

            color: #285943;

            text-decoration: none;

            font-size: 14px;
        }

        .back:hover {

            text-decoration: underline;
        }

        .test-data {

            margin-top: 25px;

            padding: 12px;

            background: #f4f6f3;

            border-radius: 8px;

            font-size: 12px;

            color: #666;
        }

        @media (max-width: 500px) {

            .login-container {

                padding: 30px 22px;
            }

            h1 {

                font-size: 24px;
            }
        }

    </style>

</head>


<body>


<div class="login-container">

    <div class="logo">
        🌿
    </div>

    <h1>
        Comunidad de Apurí
    </h1>

    <p class="subtitle">
        Acceso al Portal Comunal
    </p>


    <form id="login-form">

        <div class="form-group">

            <label for="dni">
                DNI
            </label>

            <input
                type="text"
                id="dni"
                name="dni"
                maxlength="8"
                inputmode="numeric"
                autocomplete="username"
                placeholder="Ingrese su DNI"
                required
            >

        </div>


        <div class="form-group">

            <label for="password">
                Contraseña
            </label>

            <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                placeholder="Ingrese su contraseña"
                required
            >

        </div>


        <button
            type="submit"
            class="login-button"
            id="login-button">

            🔐 Ingresar

        </button>

    </form>


    <div
        id="message"
        class="message">
    </div>


    <a
        href="index.html"
        class="back">

        ← Volver al inicio

    </a>


    <div class="test-data">

        Usuario de prueba:<br>

        DNI: <strong>70000001</strong><br>

        Contraseña: la configurada en Supabase Auth

    </div>

</div>


<!-- Código que procesa el inicio de sesión -->
<script src="js/login.js"></script>


</body>

</html>
