
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel del Tesorero - Comunidad Campesina de Apurí</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --primary:#14532d;--primary2:#166534;--bg:#f4f7f5;--card:#fff;--text:#17211b;
  --muted:#68756d;--border:#dfe7e1;--danger:#b91c1c;--success:#166534;--warning:#a16207;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
header{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;padding:24px 18px}
.header-inner{max-width:1150px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:20px}
h1{font-size:24px;margin:0 0 5px}.subtitle{opacity:.88;font-size:14px}
button{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}
.btn-light{background:#fff;color:var(--primary)}.btn-primary{background:var(--primary);color:#fff}.btn-danger{background:#fee2e2;color:#991b1b}
main{max-width:1150px;margin:22px auto;padding:0 16px}
.notice{padding:13px 15px;border-radius:10px;margin-bottom:18px;background:#ecfdf5;color:#166534;border:1px solid #bbf7d0}
.notice.error{background:#fef2f2;color:#991b1b;border-color:#fecaca}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:0 3px 12px rgba(0,0,0,.04)}
.card .label{font-size:13px;color:var(--muted);margin-bottom:7px}.amount{font-size:27px;font-weight:800}.cash{border-top:4px solid #166534}.bank{border-top:4px solid #1d4ed8}.yape{border-top:4px solid #7e22ce}.total{border-top:4px solid #111827}
.section-title{font-size:19px;margin:8px 0 13px}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{
width:100%;padding:11px;border:1px solid #cfd9d1;border-radius:9px;background:#fff;font-size:14px}
.field textarea{min-height:85px;resize:vertical}.full{grid-column:1/-1}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.panel{background:#fff;border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:20px}
.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.tab{background:#eef2ef;color:#33443a}.tab.active{background:var(--primary);color:#fff}
.hidden{display:none!important}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 8px;border-bottom:1px solid #e8eee9;text-align:left}th{background:#f7faf8;color:#536158}
.ingreso{color:#166534;font-weight:700}.egreso{color:#b91c1c;font-weight:700}
.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:end}
.empty{text-align:center;color:var(--muted);padding:25px}
.userbox{font-size:13px;text-align:right}.userbox strong{display:block;font-size:14px}
.loading{text-align:center;padding:25px;color:var(--muted)}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.form-grid,.filters{grid-template-columns:1fr}}
@media(max-width:500px){.grid{grid-template-columns:1fr}.header-inner{align-items:flex-start;flex-direction:column}.userbox{text-align:left}}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div>
      <h1>Panel del Tesorero</h1>
      <div class="subtitle">Comunidad Campesina de Apurí</div>
    </div>
    <div class="userbox">
      <strong id="usuarioNombre">Verificando acceso...</strong>
      <span id="usuarioRol"></span>
      <div style="margin-top:10px"><button class="btn-light" id="btnSalir">Cerrar sesión</button></div>
    </div>
  </div>
</header>

<main>
  <div id="mensaje" class="notice hidden"></div>

  <section>
    <h2 class="section-title">Situación actual de los fondos</h2>
    <div class="grid">
      <div class="card cash"><div class="label">💵 Efectivo</div><div class="amount" id="saldoEfectivo">S/ 0.00</div></div>
      <div class="card bank"><div class="label">🏦 Banco</div><div class="amount" id="saldoBanco">S/ 0.00</div></div>
      <div class="card yape"><div class="label">📱 Yape</div><div class="amount" id="saldoYape">S/ 0.00</div></div>
      <div class="card total"><div class="label">💰 Total disponible</div><div class="amount" id="saldoTotal">S/ 0.00</div></div>
    </div>
  </section>

  <div class="tabs">
    <button class="tab active" data-tab="movimiento">Registrar movimiento</button>
    <button class="tab" data-tab="historial">Historial</button>
  </div>

  <section id="tab-movimiento" class="panel">
    <h2 class="section-title">Registrar ingreso o egreso</h2>
    <form id="formMovimiento">
      <div class="form-grid">
        <div class="field">
          <label for="tipo">Tipo *</label>
          <select id="tipo" required>
            <option value="INGRESO">Ingreso</option>
            <option value="EGRESO">Egreso</option>
          </select>
        </div>
        <div class="field">
          <label for="fondo">Fondo *</label>
          <select id="fondo" required>
            <option value="EFECTIVO">💵 Efectivo</option>
            <option value="BANCO">🏦 Banco</option>
            <option value="YAPE">📱 Yape</option>
          </select>
        </div>
        <div class="field">
          <label for="fecha">Fecha *</label>
          <input type="date" id="fecha" required>
        </div>
        <div class="field">
          <label for="monto">Monto (S/) *</label>
          <input type="number" id="monto" min="0.01" step="0.01" required>
        </div>
        <div class="field full">
          <label for="concepto">Concepto *</label>
          <input type="text" id="concepto" maxlength="250" placeholder="Ej.: Aporte comunal, compra de materiales..." required>
        </div>
        <div class="field">
          <label for="medio">Medio</label>
          <select id="medio">
            <option value="EFECTIVO">Efectivo</option>
            <option value="TRANSFERENCIA">Transferencia</option>
            <option value="DEPOSITO">Depósito</option>
            <option value="OTRO">Otro</option>
          </select>
        </div>
        <div class="field">
          <label for="comprobante">Comprobante / referencia</label>
          <input type="text" id="comprobante" maxlength="150" placeholder="N.º de comprobante, operación, etc.">
        </div>
        <div class="field full">
          <label for="observacion">Observación</label>
          <textarea id="observacion" maxlength="500" placeholder="Dato adicional (opcional)"></textarea>
        </div>
      </div>
      <div class="actions">
        <button class="btn-primary" type="submit" id="btnGuardar">Guardar movimiento</button>
        <button type="reset" class="tab">Limpiar</button>
      </div>
    </form>
  </section>

  <section id="tab-historial" class="panel hidden">
    <h2 class="section-title">Historial de movimientos</h2>
    <div class="filters">
      <div class="field"><label>Desde</label><input type="date" id="desde"></div>
      <div class="field"><label>Hasta</label><input type="date" id="hasta"></div>
      <div class="actions" style="margin:0">
        <button class="btn-primary" id="btnFiltrar">Filtrar</button>
        <button class="tab" id="btnTodo">Todo</button>
        <button class="tab" id="btnCSV">Exportar CSV</button>
      </div>
    </div>
    <div style="overflow:auto;margin-top:18px">
      <table>
        <thead><tr><th>Fecha</th><th>Tipo</th><th>Concepto</th><th>Fondo</th><th>Medio</th><th>Monto</th><th>Comprobante</th></tr></thead>
        <tbody id="tablaMovimientos"><tr><td colspan="7" class="loading">Cargando...</td></tr></tbody>
      </table>
    </div>
  </section>
</main>

<script>
const SUPABASE_URL = 'https://lrwewsaigjpvhgkpcpdp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_sdMjDpcJeQ0M7aRcqjOm4A_2FSS5DJ5';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let movimientosActuales = [];

const $ = id => document.getElementById(id);
const dinero = n => 'S/ ' + Number(n || 0).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2});

function mostrarMensaje(texto, error=false){
  const el=$('mensaje'); el.textContent=texto; el.className='notice'+(error?' error':''); el.classList.remove('hidden');
  setTimeout(()=>el.classList.add('hidden'),5000);
}

async function verificarAcceso(){
  const {data:{session}} = await supabaseClient.auth.getSession();
  if(!session){ location.href='index.html'; return false; }

  const {data,error}=await supabaseClient.rpc('obtener_mi_perfil');
  if(error || !data || !data.length){
    mostrarMensaje('No se pudo verificar el perfil de usuario.',true); return false;
  }

  const perfil=data[0];
  if(!['TESORERO','ADMINISTRADOR'].includes(perfil.rol)){
    mostrarMensaje('Este usuario no tiene permisos para acceder al Panel del Tesorero.',true);
    setTimeout(()=>location.href='dashboard.html',1800);
    return false;
  }

  $('usuarioNombre').textContent=perfil.nombre_completo || 'Usuario';
  $('usuarioRol').textContent=perfil.rol;
  return true;
}

async function cargarFondos(){
  const {data,error}=await supabaseClient.rpc('obtener_situacion_fondos');
  if(error){ mostrarMensaje('Error al cargar los saldos: '+error.message,true); return; }
  const f=data?.[0] || {};
  $('saldoEfectivo').textContent=dinero(f.efectivo);
  $('saldoBanco').textContent=dinero(f.banco);
  $('saldoYape').textContent=dinero(f.yape);
  $('saldoTotal').textContent=dinero(f.total);
}

async function cargarMovimientos(){
  const desde=$('desde').value || null;
  const hasta=$('hasta').value || null;
  const {data,error}=await supabaseClient.rpc('obtener_movimientos_transparencia',{
    p_fecha_inicio:desde,p_fecha_fin:hasta
  });
  if(error){ mostrarMensaje('Error al cargar movimientos: '+error.message,true); return; }
  movimientosActuales=data || [];
  renderTabla();
}

function renderTabla(){
  const tbody=$('tablaMovimientos');
  if(!movimientosActuales.length){
    tbody.innerHTML='<tr><td colspan="7" class="empty">No hay movimientos en el periodo seleccionado.</td></tr>'; return;
  }
  tbody.innerHTML=movimientosActuales.map(m=>`
    <tr>
      <td>${m.fecha || ''}</td>
      <td class="${m.tipo==='INGRESO'?'ingreso':'egreso'}">${m.tipo}</td>
      <td>${esc(m.concepto)}</td>
      <td>${esc(m.fondo || '-')}</td>
      <td>${esc(m.medio || '-')}</td>
      <td class="${m.tipo==='INGRESO'?'ingreso':'egreso'}">${m.tipo==='INGRESO'?'+':'-'} ${dinero(m.monto)}</td>
      <td>${esc(m.comprobante || '-')}</td>
    </tr>`).join('');
}

function esc(v){
  return String(v ?? '').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[s]));
}

async function guardarMovimiento(e){
  e.preventDefault();
  const btn=$('btnGuardar'); btn.disabled=true; btn.textContent='Guardando...';

  const payload={
    p_tipo:$('tipo').value,
    p_fecha:$('fecha').value,
    p_concepto:$('concepto').value.trim(),
    p_monto:Number($('monto').value),
    p_fondo:$('fondo').value,
    p_medio:$('medio').value,
    p_comprobante:$('comprobante').value.trim() || null,
    p_observacion:$('observacion').value.trim() || null
  };

  const {error}=await supabaseClient.rpc('registrar_movimiento_tesoreria',payload);
  btn.disabled=false; btn.textContent='Guardar movimiento';

  if(error){ mostrarMensaje(error.message,true); return; }

  mostrarMensaje('Movimiento registrado correctamente.');
  $('formMovimiento').reset();
  $('fecha').value=new Date().toISOString().slice(0,10);
  await cargarFondos();
  await cargarMovimientos();
}

function exportarCSV(){
  if(!movimientosActuales.length){mostrarMensaje('No hay movimientos para exportar.',true);return;}
  const filas=[['Fecha','Tipo','Concepto','Fondo','Medio','Monto','Comprobante','Observación']];
  movimientosActuales.forEach(m=>filas.push([m.fecha,m.tipo,m.concepto,m.fondo||'',m.medio||'',m.monto,m.comprobante||'',m.observacion||'']));
  const csv=filas.map(f=>f.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='movimientos_tesoreria.csv';a.click();URL.revokeObjectURL(a.href);
}

document.querySelectorAll('.tab[data-tab]').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.tab[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');
  document.querySelectorAll('[id^="tab-"]').forEach(x=>x.classList.add('hidden'));
  $('tab-'+b.dataset.tab).classList.remove('hidden');
  if(b.dataset.tab==='historial') cargarMovimientos();
}));

$('formMovimiento').addEventListener('submit',guardarMovimiento);
$('btnFiltrar').addEventListener('click',cargarMovimientos);
$('btnTodo').addEventListener('click',()=>{$('desde').value='';$('hasta').value='';cargarMovimientos()});
$('btnCSV').addEventListener('click',exportarCSV);
$('btnSalir').addEventListener('click',async()=>{await supabaseClient.auth.signOut();location.href='index.html'});
$('fecha').value=new Date().toISOString().slice(0,10);

(async()=>{
  const ok=await verificarAcceso();
  if(ok){await cargarFondos();await cargarMovimientos();}
})();
</script>
</body>
</html>
